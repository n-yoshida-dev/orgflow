openapi: 3.0.4
info:
  title: OrgFlow API
  version: 0.1.0

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

paths:
  /login:
    post:
      operationId: login
      security: []
      tags:
        - Auth
      summary: ログイン
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/tenants:
    get:
      operationId: listMyTenants
      tags:
        - Tenant
      summary: 自分が所属するtenant一覧取得
      description: 認証済みJWTのsubから取得したuserIdをもとに、そのuserが所属しているtenant一覧を返す。current_tenant_idは使用しないため、ログイン直後JWTでもtenant選択後JWTでも呼び出せる。
      responses:
        '200':
          description: 所属tenant一覧取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /tenants/{tenantId}/select:
    post:
      operationId: selectTenant
      tags:
        - Auth
      summary: テナント切り替え
      parameters:
        - name: tenantId
          description: テナントを指定するID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: テナント切り替え成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSelectResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /requests:
    post:
      operationId: createRequest
      tags:
        - Requests
      summary: request作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequestInput'
      responses:
        '201':
          description: request投稿成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
    get:
      operationId: listRequests
      tags:
        - Requests
      summary: request を一覧表示する
      parameters:
        - name: scope
          description: request 一覧の絞り込み条件。省略時は全件、pending-approval 指定時は承認対象のみ返す
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending-approval
      responses:
        '200':
          description: request 一覧取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRequestsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /requests/{requestId}:
    parameters:
      - name: requestId
        description: リクエストを指定するID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRequest
      tags:
        - Requests
      summary: request を1件取り出す
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
    patch:
      operationId: updateRequestDraft
      tags:
        - Requests
      summary: リクエストの下書きを修正する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRequestRequest'
      responses:
        '200':
          description: 下書き修正成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
    delete:
      operationId: deleteRequestDraft
      tags:
        - Requests
      summary: 下書きのリクエストを削除する
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /requests/{requestId}/submit:
    post:
      operationId: submitRequest
      tags:
        - Requests
      summary: 下書きのリクエストを提出する
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequestRequest'
      responses:
        '201':
          description: 下書き提出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /requests/{requestId}/cancel:
    post:
      operationId: cancelRequest
      tags:
        - Requests
      summary: request を取り消す
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 取消成功
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /requests/{requestId}/approve:
    post:
      operationId: approveRequest
      tags:
        - Approvals
      summary: request を承認する
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 承認成功
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /requests/{requestId}/return:
    post:
      operationId: returnRequest
      tags:
        - Approvals
      summary: request を差戻しする
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 差戻し成功
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /requests/{requestId}/reject:
    post:
      operationId: rejectRequest
      tags:
        - Approvals
      summary: request を却下する
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 却下成功
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /audit-logs:
    get:
      operationId: listAuditLog
      tags:
        - AuditLogs
      summary: audit-log を一覧取得する
      responses:
        '200':
          description: 一覧取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuditLogResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /audit-logs/{auditLogId}:
    get:
      operationId: getAuditLog
      tags:
        - AuditLogs
      summary: audit-log を1件取得する
      parameters:
        - name: auditLogId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 1件取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /tenants/{tenantId}:
    delete:
      operationId: deleteTenant
      tags:
        - Tenants
      summary: tenant を削除する
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: tenant削除成功
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /users:
    post:
      operationId: createUser
      tags:
        - Users
      summary: user を作成する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: user 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
    get:
      operationId: listUsers
      tags:
        - Users
      summary: user 一覧を取得する
      responses:
        '200':
          description: user一覧取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getUser
      tags:
        - Users
      summary: user 情報を1件取得する
      responses:
        '200':
          description: 1件取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      operationId: updateUser
      tags:
        - Users
      summary: user 情報を更新する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
    delete:
      operationId: deleteUser
      tags:
        - Users
      summary: user を削除する
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /tenant-memberships/{tenantMembershipId}/roles:
    parameters:
      - name: tenantMembershipId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listTenantMembershipRoles
      tags:
        - TenantMembershipRoles
      summary: tenantMembershipRoleを全件取得する
      responses:
        '200':
          description: 全件取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTenantMembershipRolesResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      operationId: createTenantMembershipRole
      tags:
        - TenantMembershipRoles
      summary: tenantMembershipRoleを作成する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRole'
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMembershipRole'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /tenant-memberships/{tenantMembershipId}/roles/{tenantRoleId}:
    delete:
      operationId: deleteTenantMembershipRole
      tags:
        - TenantMembershipRoles
      summary: tenantMembershipRoleを1件削除する
      parameters:
        - name: tenantMembershipId
          in: path
          required: true
          schema:
            type: string
        - name: tenantRoleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /internal-organization-memberships/{internalOrganizationMembershipId}/roles:
    parameters:
      - name: internalOrganizationMembershipId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listInternalOrganizationMembershipRoles
      tags:
        - InternalOrganizationMembershipRoles
      summary: internalOrganizationMembershipRole を全件取得する
      responses:
        '200':
          description: 全件取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInternalOrganizationMembershipRolesResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      operationId: createInternalOrganizationMembershipRole
      tags:
        - InternalOrganizationMembershipRoles
      summary: internalOrganizationMembershipRole を作成する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInternalOrganizationMembershipRole'
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalOrganizationMembershipRole'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /internal-organization-memberships/{internalOrganizationMembershipId}/roles/{internalOrganizationRoleId}:
    delete:
      operationId: deleteInternalOrganizationMembershipRole
      tags:
        - InternalOrganizationMembershipRoles
      summary: internalOrganizationMembershipRole を1件削除する
      parameters:
        - name: internalOrganizationMembershipId
          in: path
          required: true
          schema:
            type: string
        - name: internalOrganizationRoleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ---- Request Bodies ----

    LoginRequest:
      type: object
      required:
        - loginId
        - password
      properties:
        loginId:
          type: string
        password:
          type: string

    CreateRequestInput:
      type: object
      required:
        - title
        - internalOrganizationId
        - requestType
        - amount
      properties:
        title:
          type: string
          maxLength: 100
        internalOrganizationId:
          type: string
          format: uuid
        requestType:
          type: string
          enum: [transportation_expenses, travel_expenses, equipment_purchase_expenses]
        amount:
          type: integer
          minimum: 0

    PatchRequestRequest:
      type: object
      properties:
        title:
          type: string

    SubmitRequestRequest:
      type: object
      properties:
        title:
          type: string

    CreateUserRequest:
      type: object
      required:
        - displayName
        - loginId
        - password
        - mailAddress
      properties:
        displayName:
          type: string
        loginId:
          type: string
        password:
          type: string
        mailAddress:
          type: string
          format: email

    UpdateUserRequest:
      type: object
      properties:
        displayName:
          type: string
        loginId:
          type: string
        password:
          type: string
        mailAddress:
          type: string
          format: email

    CreateTenantRole:
      type: object
      required:
        - tenantRole
      properties:
        tenantRole:
          type: string

    CreateInternalOrganizationMembershipRole:
      type: object
      required:
        - internalOrganizationRole
      properties:
        internalOrganizationRole:
          type: string

    # ---- Entities ----

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ユーザーID
        displayName:
          type: string
          description: 表示名
        loginId:
          type: string
          description: ログインID
        mailAddress:
          type: string
          format: email
          description: メールアドレス
        createdAt:
          type: string
          format: date-time
          description: 作成日時

    Request:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: リクエストID
        tenantId:
          type: string
          format: uuid
          description: テナントID
        requestSeriesId:
          type: string
          format: uuid
          description: リクエストシリーズID（同一申請の改版をまとめる単位）
        versionNo:
          type: integer
          description: バージョン番号
        status:
          type: string
          enum: [draft, in_progress, approved, returned, rejected, cancelled]
          description: リクエストの状態
        currentAppliedApprovalRouteStepId:
          type: string
          format: uuid
          nullable: true
          description: 現在の承認ルートステップID
        applicantUserId:
          type: string
          format: uuid
          description: 申請者ユーザーID
        internalOrganizationId:
          type: string
          format: uuid
          description: 申請元の内部組織ID
        requestType:
          type: string
          enum: [transportation_expenses, travel_expenses, equipment_purchase_expenses]
          description: 申請種別
        title:
          type: string
          maxLength: 100
          description: 申請の件名
        description:
          type: string
          nullable: true
          description: 申請の詳細
        amount:
          type: integer
          minimum: 0
          description: 申請金額（円）
        createdAt:
          type: string
          format: date-time
          description: 作成日時
        updatedAt:
          type: string
          format: date-time
          description: 更新日時

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 監査ログID
        actorTenantId:
          type: string
          format: uuid
          description: 操作者のテナントID
        actorUserId:
          type: string
          format: uuid
          description: 操作者のユーザーID
        actorUserDisplayName:
          type: string
          description: 操作者の表示名
        actorInternalOrganizationId:
          type: string
          format: uuid
          nullable: true
          description: 操作者の内部組織ID
        actorInternalOrganizationName:
          type: string
          nullable: true
          description: 操作者の内部組織名
        actorUserMailAddress:
          type: string
          format: email
          description: 操作者のメールアドレス
        targetType:
          type: string
          description: 操作対象のリソース種別
        targetId:
          type: string
          format: uuid
          description: 操作対象のID
        operationType:
          type: string
          enum: [create, update, delete, submit, approve, return, reject, cancel, login, logout]
          description: 操作種別
        occurredAt:
          type: string
          format: date-time
          description: 操作発生日時

    TenantMembershipRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: テナントメンバーシップロールID
        tenantMembershipId:
          type: string
          format: uuid
          description: テナントメンバーシップID
        tenantRoleId:
          type: string
          format: uuid
          description: テナントロールID
        roleName:
          type: string
          description: ロール名

    InternalOrganizationMembershipRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 内部組織メンバーシップロールID
        internalOrganizationMembershipId:
          type: string
          format: uuid
          description: 内部組織メンバーシップID
        internalOrganizationRoleId:
          type: string
          format: uuid
          description: ロールID
        internalOrganizationRoleName:
          type: string
          description: ロール名

    # ---- Response Bodies ----

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: 認証トークン（JWT）
        currentTenantId:
          type: string
          format: uuid
